version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.12

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install requests

      - run:
          name: Run unit tests
          command: |
            python -m unittest discover -v

workflows:
  build-and-test:
    jobs:
      - build
